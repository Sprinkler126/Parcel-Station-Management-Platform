server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: station-parcel

  # H2 以 MySQL 兼容模式启动，使 Flyway 脚本在两种数据库上通用。
  # AUTO_SERVER=TRUE 允许并发测试用例以多连接访问同一文件库。
  datasource:
    url: jdbc:h2:file:./data/station;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      pool-name: station-pool
      maximum-pool-size: 20

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      # schema 由 Flyway 管理，Hibernate 只做校验，杜绝实体与脚本漂移
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 50
        order_inserts: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    # db/seed 只在主 profile 生效；application-test.yml 里只列 db/migration，
    # 演示数据因此进不了测试库——集成测试大量断言精确计数（total=2、available=99），
    # 混入种子数据会让这些断言整体偏移，且报错信息毫无指向性。
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

app:
  # 滞留分级阈值（小时）
  overdue:
    warn-hours: 48
    alert-hours: 72
  # 入库并发冲突的事务外重试次数
  inbound:
    max-retry: 8
  # 种子数据：仅在非 test profile 下装载
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.sf.station: INFO
  pattern:
    console: '%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n'
