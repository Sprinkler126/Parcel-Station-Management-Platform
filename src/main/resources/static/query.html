<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>包裹查询 · 驿站工作台</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">驿</span><span>末端驿站工作台</span></a><nav class="nav"><a href="/">产品介绍</a><a href="/inbound.html">入库</a><a href="/pickup.html">取件</a><a class="active" href="/query.html">查询</a><a href="/dashboard.html">看板</a><a href="/settings.html">设置</a></nav></header>
<main class="shell"><div class="page-head"><div><div class="eyebrow">Parcel lookup</div><h1>包裹查询</h1><p>可按姓名、取件码、尾号、运单号、联系号和状态组合筛选；已填写的条件同时生效。</p></div></div>
<section class="card"><div class="quick-demos"><span class="muted small">快速演示</span><button type="button" data-demo="15-1-3">取件码</button><button type="button" data-demo="5678">同尾号多件</button><button type="button" data-name="张">按姓名</button><button type="button" data-demo="SF7777000011112" data-status="">同运单历史</button><button type="button" data-demo="" data-overdue="ALERT">严重滞留</button></div><form id="searchForm" class="toolbar query-toolbar">
<div class="field search-main"><label for="keyword">综合关键字</label><input id="keyword" placeholder="自动识别取件码 / 尾号 / 运单号 / 联系号" autofocus></div>
<div class="field"><label for="receiverName">收件人姓名</label><input id="receiverName" placeholder="支持姓名包含匹配"></div>
<div class="field"><label for="pickupCodeFilter">取件码</label><input id="pickupCodeFilter" placeholder="15-1-16"></div>
<div class="field"><label for="realSuffix">真实尾号</label><input id="realSuffix" inputmode="numeric" maxlength="4" placeholder="5678"></div>
<div class="field"><label for="trackingNo">运单号</label><input id="trackingNo" placeholder="完整运单号"></div>
<div class="field"><label for="contactNo">联系号</label><input id="contactNo" placeholder="完整联系号"></div>
<div class="field"><label for="status">状态</label><select id="status"><option value="PENDING">待取件</option><option value="">全部</option><option value="PICKED_UP">已取件</option><option value="RETURNED">已退回</option></select></div>
<div class="field"><label for="overdue">滞留档位</label><select id="overdue"><option value="">全部</option><option value="WARN">48–72 小时</option><option value="ALERT">超过 72 小时</option></select></div>
<div class="field"><label for="codePrefix">排前缀</label><input id="codePrefix" placeholder="15-1"></div>
<button id="searchButton" class="btn btn-primary" type="submit">组合查询</button></form>
<div class="table-wrap"><table><thead><tr><th>取件码</th><th>核对信息</th><th>入库 / 滞留</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的包裹</div></div>
<div class="pager"><button id="prev" class="btn btn-sm">上一页</button><span id="pageInfo" class="muted small">第 1 页</span><button id="next" class="btn btn-sm">下一页</button></div></section></main>
<script src="/js/app.js"></script><script src="/js/query.js"></script></body></html>
