<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>包裹查询 · 驿站工作台</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">驿</span><span>末端驿站工作台</span></a><nav class="nav"><a href="/">产品介绍</a><a href="/inbound.html">入库</a><a href="/pickup.html">取件</a><a class="active" href="/query.html">查询</a><a href="/dashboard.html">看板</a></nav></header>
<main class="shell"><div class="page-head"><div><div class="eyebrow">Parcel lookup</div><h1>包裹查询</h1><p>系统自动识别取件码、真实尾号、运单号和完整联系号。</p></div></div>
<section class="card"><div class="quick-demos"><span class="muted small">快速演示</span><button type="button" data-demo="15-1-3">取件码</button><button type="button" data-demo="5678">同尾号多件</button><button type="button" data-demo="SF7777000011112" data-status="">同运单历史</button><button type="button" data-demo="" data-overdue="ALERT">严重滞留</button></div><form id="searchForm" class="toolbar"><div class="field search-main"><label for="keyword">查询内容</label><input id="keyword" placeholder="取件码 / 后四位 / 运单号 / 联系号" autofocus></div><div class="field"><label for="status">状态</label><select id="status"><option value="PENDING">待取件</option><option value="">全部</option><option value="PICKED_UP">已取件</option><option value="RETURNED">已退回</option></select></div><div class="field"><label for="overdue">滞留档位</label><select id="overdue"><option value="">全部</option><option value="WARN">48–72 小时</option><option value="ALERT">超过 72 小时</option></select></div><div class="field"><label for="codePrefix">排前缀</label><input id="codePrefix" placeholder="15-1"></div><button id="searchButton" class="btn btn-primary" type="submit">查询</button></form>
<div class="table-wrap"><table><thead><tr><th>取件码</th><th>核对信息</th><th>入库 / 滞留</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的包裹</div></div>
<div class="pager"><button id="prev" class="btn btn-sm">上一页</button><span id="pageInfo" class="muted small">第 1 页</span><button id="next" class="btn btn-sm">下一页</button></div></section></main>
<script src="/js/app.js"></script><script src="/js/query.js"></script></body></html>
