<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取件工作台 · 驿站工作台</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">驿</span><span>末端驿站工作台</span></a><nav class="nav"><a href="/">产品介绍</a><a href="/inbound.html">入库</a><a class="active" href="/pickup.html">取件</a><a href="/query.html">查询</a><a href="/dashboard.html">看板</a><a href="/settings.html">设置</a></nav></header>
<main class="shell"><div class="page-head"><div><div class="eyebrow">Pickup counter</div><h1>取件工作台</h1><p>先查后核对，再确认交付。支持取件码精准取件与真实尾号多件聚合。</p></div><div class="operator-box"><label for="pickupOperator">当前操作员</label><input id="pickupOperator" maxlength="32" placeholder="站员A"></div></div>
<div class="pickup-mode"><button class="active" data-mode="code">按取件码</button><button data-mode="suffix">按手机尾号</button></div>
<section class="pickup-layout">
  <div class="card pickup-search-card">
    <div id="codeSearchPane"><div class="section-title"><h2>取件码核销</h2><button id="demoCode" class="btn btn-sm" type="button">填入演示件</button></div><p class="muted">输入完整取件码，系统只返回仍在库的精确匹配包裹。</p><form id="codeForm"><div class="field"><label for="pickupCodeInput">完整取件码</label><input id="pickupCodeInput" class="hero-input" placeholder="例如 15-1-1" autocomplete="off" autofocus required></div><button id="codeSearchButton" class="btn btn-primary wide" type="submit">查找待取包裹</button></form></div>
    <div id="suffixSearchPane" hidden><div class="section-title"><h2>尾号聚合取件</h2><button id="demoSuffix" class="btn btn-sm" type="button">填入演示尾号</button></div><p class="muted">只使用客户真实后四位聚合，不使用可能被回收的 AXB 虚拟号码。</p><form id="suffixForm"><div class="field"><label for="suffixInput">真实手机后四位</label><input id="suffixInput" class="hero-input" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="例如 5678" required></div><button id="suffixSearchButton" class="btn btn-primary wide" type="submit">查找该客户全部包裹</button></form></div>
    <div class="counter-note"><strong>交付核对</strong><span>取件码 / 脱敏号码 / 收件人 / 运单尾号</span></div>
  </div>
  <div class="card pickup-result-card"><div class="section-title"><div><h2 id="resultHeading">待核对包裹</h2><p id="companionHint" class="muted small" hidden>已自动追加同姓名、同真实尾号的在库包裹；追加件需人工勾选后交付。</p></div><span id="resultCount" class="tag">0 件</span></div><div id="pickupEmpty" class="empty">输入取件信息后，这里会显示待核对包裹</div><div id="pickupResults"></div><div id="pickupActions" class="pickup-actions" hidden><div><strong id="selectionSummary">已选择 0 件</strong><p class="muted small">确认后状态将变为已取件，并进入取件码冷却期。</p></div><button id="confirmPickup" class="btn btn-primary" type="button">确认交付</button></div></div>
</section></main><script src="/js/app.js"></script><script src="/js/pickup.js"></script></body></html>
