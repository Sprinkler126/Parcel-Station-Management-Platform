# =============================================================================
# 生产切换 MySQL 的 profile 说明（文档 §14：保留 profile 说明生产可平滑切换）
#
# 启动方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 或：
#   java -jar target/station-parcel-1.0.0.jar --spring.profiles.active=mysql
#
# 前置：手工建库
#   CREATE DATABASE station DEFAULT CHARSET utf8mb4 COLLATE utf8mb4_general_ci;
#
# 由于 H2 已以 MODE=MySQL 运行，db/migration 下的脚本无需任何改动即可在 MySQL 执行。
# 两条唯一索引依赖"唯一索引允许多个 NULL"这一特性，MySQL InnoDB 与 H2 行为一致。
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:station}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false
